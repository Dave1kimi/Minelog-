<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineLog Supervisor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }
.header { background: #141414; padding: 12px 16px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 16px; }
.refresh { color: #f59e0b; font-size: 13px; cursor: pointer; }
.container { padding: 12px; max-width: 600px; margin: 0 auto; }
.now-bar { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 12px; padding: 0 4px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.sum-box { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; text-align: center; }
.sum-num { font-size: 28px; font-weight: 700; color: #f59e0b; }
.sum-label { font-size: 11px; color: #666; margin-top: 4px; text-transform: uppercase; }
.worker-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.worker-card.alert { border-left: 3px solid #dc2626; }
.worker-card.idle { border-left: 3px solid #f59e0b; }
.worker-card.active { border-left: 3px solid #16a34a; }
.worker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.worker-name { font-size: 15px; font-weight: 600; }
.worker-badge { font-size: 12px; color: #666; }
.status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; background: #2a2a2a; }
.status.on { background: #14532d; color: #4ade80; }
.status.off { background: #2a2a2a; color: #666; }
.status.idle { background: #451a03; color: #fbbf24; }
.worker-info { font-size: 13px; color: #888; line-height: 1.6; }
.worker-info span { color: #e0e0e0; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-view { background: #252525; color: #e0e0e0; }
.btn-stop { background: #7f1d1d; color: #fca5a5; }
.btn:active { opacity: 0.8; }
.empty { text-align: center; color: #444; padding: 40px; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
  <h1>⛏️ MineLog Supervisor</h1>
  <span class="refresh" onclick="load()">🔄 Refresh</span>
</div>
<div class="container">
  <div class="summary" id="summary">
    <div class="sum-box"><div class="sum-num" id="sumOn">0</div><div class="sum-label">On Shift</div></div>
    <div class="sum-box"><div class="sum-num" id="sumTotal">0</div><div class="sum-label">Workers</div></div>
    <div class="sum-box"><div class="sum-num" id="sumHours">0</div><div class="sum-label">Hours Today</div></div>
  </div>
  <div class="now-bar">
    <span id="nowTime">--:--</span>
    <span id="alertCount">0 alerts</span>
  </div>
  <div id="workerList"><div class="empty">Loading...</div></div>
</div>

<script>
const API = window.location.origin + '/api';

async function load() {
  try {
    const [workers, live] = await Promise.all([
      fetch(API + '/supervisor/workers').then(r => r.json()),
      fetch(API + '/supervisor/live').then(r => r.json())
    ]);
    document.getElementById('sumOn').textContent = live.active_workers || 0;
    document.getElementById('sumTotal').textContent = live.total_workers || 0;
    document.getElementById('sumHours').textContent = Math.floor((live.total_active_seconds || 0) / 3600);
    const alerts = workers.filter(w => w.is_online && (!w.current_activity || w.shift_duration > 720));
    document.getElementById('alertCount').textContent = alerts.length + ' alert' + (alerts.length !== 1 ? 's' : '');
    if (!workers.length) { document.getElementById('workerList').innerHTML = '<div class="empty">No workers</div>'; return; }
    document.getElementById('workerList').innerHTML = workers.map(w => {
      let cardClass = '', statusClass = 'off', statusText = 'Off', info = 'Not clocked in';
      if (w.is_online) {
        const hrs = Math.floor(w.shift_duration / 60);
        const mins = w.shift_duration % 60;
        const timeStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
        if (!w.current_activity) { cardClass = 'idle'; statusClass = 'idle'; statusText = 'Idle'; info = `${timeStr} on shift • No task`; }
        else if (w.shift_duration > 720) { cardClass = 'alert'; statusClass = 'on'; statusText = 'On'; info = `${timeStr} on shift ⚠️ Long shift • ${w.current_activity}`; }
        else { cardClass = 'active'; statusClass = 'on'; statusText = 'On'; info = `${timeStr} on shift • ${w.current_activity}`; }
      }
      return `<div class="worker-card ${cardClass}"><div class="worker-header"><div><div class="worker-name">${w.name}</div><div class="worker-badge">#${w.badge_id}</div></div><span class="status ${statusClass}">${statusText}</span></div><div class="worker-info">${info}</div>${w.is_online ? `<div class="actions"><button class="btn btn-view" onclick="detail(${w.id})">Details</button><button class="btn btn-stop" onclick="stop(${w.id}, '${w.name}')">Clock Out</button></div>` : ''}</div>`;
    }).join('');
  } catch {
    document.getElementById('workerList').innerHTML = '<div class="empty">Error loading</div>';
  }
}

async function detail(id) {
  try {
    const res = await fetch(API + '/supervisor/shift/' + id);
    const s = await res.json();
    if (!s) { alert('No active shift'); return; }
    const tasks = s.tasks.map(t => `• ${t.activity}: ${Math.floor((t.duration_seconds||0)/60)}m`).join('\n');
    alert(`${s.name} #${s.badge_id}\nShift: ${Math.floor(s.shift_duration_seconds/3600)}h ${Math.floor((s.shift_duration_seconds%3600)/60)}m\nEfficiency: ${s.efficiency}%\nTasks: ${s.tasks.length}\n\n${tasks || 'No tasks'}`);
  } catch { alert('Error'); }
}

async function stop(id, name) {
  if (!confirm('Clock out ' + name + '?')) return;
  try {
    await fetch(API + '/supervisor/force-clockout', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({worker_id: id}) });
    load();
  } catch { alert('Failed'); }
}

setInterval(() => {
  document.getElementById('nowTime').textContent = new Date().toLocaleTimeString('en-US', {hour12: false, hour:'2-digit', minute:'2-digit'});
}, 1000);

load();
setInterval(load, 30000);
</script>
</body>
</html>
